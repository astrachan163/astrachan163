name: checks

on:
  pull_request:
  push:

jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fail if the retired mark name is present
        run: node scripts/check-banned-mark.mjs
      - name: Claims and emoji gates
        run: node scripts/check-claims.mjs && node scripts/check-emoji.mjs
